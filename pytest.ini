[pytest]
testpaths = tests
# -ra muestra el resumen de saltados y fallados al final, que es lo que uno
# quiere ver cuando faltan los videos o el cache de resultados.
addopts = -ra --strict-markers
filterwarnings =
    # Se emite a proposito en los tests del caso degenerado (dispersion cero).
    ignore:Using UFloat objects with std_dev==0:UserWarning
markers =
    verde: camino feliz, tiene que funcionar y dar el numero correcto
    rojo: manejo de errores, entrada mala o datos faltantes
    amarillo: casos degradados, advertencias y limitaciones documentadas
    video: necesita los videos del laboratorio (no estan en el repo)
    red: llama a una API externa y gasta cuota
